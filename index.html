<html lang="en">
<head>

<title>Chanwoo Kim Portfolio</title>

<meta name="description" content="Chanwoo Kim, Mechanical Engineering at Boston University. Soft robotics for prosthetics, rehabilitation and medical devices.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one dark room. Left, a suit storage capsule holding a body with a glowing nervous system; right, Chanwoo in a lab coat holding a note; menu bar top right. Black and one cyan glow only. */
:root {
  --black: #000000;
  --panel: rgba(2, 10, 14, 0.94);
  --line: rgba(95, 227, 255, 0.22);
  --glow: #5fe3ff;
  --glow-soft: rgba(95, 227, 255, 0.55);
  --text: #cfeaf3;
  --dim: #6f8f9c;
  --display: "Chakra Petch", "Eurostile", "Arial Narrow", sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: #041520; color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.55; overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }
a { color: var(--glow); text-underline-offset: 3px; }

.room { position: relative; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px 24px; flex-wrap: wrap;
  padding-block: 16px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.brand { font-family: var(--display); font-weight: 700; letter-spacing: .2em; text-transform: uppercase; font-size: 14px; color: var(--glow); text-shadow: 0 0 10px var(--glow-soft); }
.brand span { color: var(--dim); text-shadow: none; font-weight: 500; letter-spacing: .14em; font-size: 11px; font-family: var(--mono); margin-left: 10px; }
nav.subs { display: flex; border: 1px solid var(--line); box-shadow: 0 0 18px rgba(95,227,255,.08) inset; }
nav.subs button { background: none; border: 0; border-left: 1px solid var(--line); padding: 10px 18px; cursor: pointer;
  font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
nav.subs button:first-child { border-left: 0; }
nav.subs button:hover, nav.subs button[aria-pressed=true] { color: var(--glow); text-shadow: 0 0 8px var(--glow-soft); background: rgba(95,227,255,.05); }

.stage { position: relative; min-height: 0; }
#scene { width: 100%; height: 100%; display: block; }
.hint { position: absolute; left: max(20px, env(safe-area-inset-left, 0px)); top: 4px; font-family: var(--mono); font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
.foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 16px; font-family: var(--mono); font-size: 11px; color: var(--dim);
  padding-block: 12px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); border-top: 1px solid var(--line); }

/* svg pieces */
.glow-soft { filter: drop-shadow(0 0 3px rgba(143,240,255,.9)) drop-shadow(0 0 10px rgba(95,227,255,.45)); }
.lamp rect { filter: drop-shadow(0 0 8px #bff6ff) drop-shadow(0 0 22px #5fe3ff); }
.hit { cursor: pointer; }
.node .ring { fill: none; stroke: #bff6ff; stroke-width: 1; transform-box: fill-box; transform-origin: center; animation: ping 2.6s ease-out infinite; }
.node .dot { fill: #e8fdff; }
.node .core { fill: #04222e; stroke: #bff6ff; stroke-width: 1.5; filter: drop-shadow(0 0 4px #5fe3ff); }
.node text, .tag text { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; fill: #bfe9f3; text-transform: uppercase; paint-order: stroke; stroke: #041520; stroke-width: 4px; stroke-linejoin: round; }
.node text.sub, .tag text.tag2 { font-size: 8.5px; fill: #6f9fb0; letter-spacing: .18em; }
.node:hover .core, .node.active .core { fill: #bff6ff; }
.node:hover text, .node.active text, .me:hover .tag text, .me.active .tag text { fill: #ffffff; }
.node.heart .dot { transform-box: fill-box; transform-origin: center; animation: beat 1s ease-in-out infinite; }
.node:focus, .me:focus { outline: none; }
.node:focus-visible .core { stroke-width: 3; }
.me .body { filter: drop-shadow(0 0 3px rgba(143,240,255,.8)) drop-shadow(0 0 10px rgba(95,227,255,.35)); transition: filter .2s; }
.me:hover .body, .me.active .body, .me:focus-visible .body { filter: drop-shadow(0 0 5px #bff6ff) drop-shadow(0 0 20px rgba(95,227,255,.75)); }
.scanring { animation: scan 6s ease-in-out infinite alternate; }
@keyframes scan { from { transform: translateY(0); } to { transform: translateY(430px); } }
@keyframes ping { 0% { transform: scale(.8); opacity: .9; } 100% { transform: scale(2.2); opacity: 0; } }
@keyframes beat { 0%, 60%, 100% { transform: scale(1); } 15% { transform: scale(1.6); } 30% { transform: scale(1.1); } 45% { transform: scale(1.4); } }
@media (prefers-reduced-motion: reduce) { .node .ring, .node.heart .dot, .scanring { animation: none; } }

/* 3d stage */
#three { position: absolute; inset: 0; }
#three canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; pointer-events: auto; background: none; border: 0; padding: 0; cursor: pointer; will-change: transform; }
.lbl .in { position: absolute; top: 0; display: flex; flex-direction: column; white-space: nowrap; transform: translateY(-50%); padding: 4px 8px; border-left: 1px solid rgba(143,240,255,.6); background: linear-gradient(90deg, rgba(3,20,28,.75), rgba(3,20,28,0)); }
.lbl.r .in { left: 16px; }
.lbl.l .in { right: 16px; border-left: 0; border-right: 1px solid rgba(143,240,255,.6); text-align: right; background: linear-gradient(270deg, rgba(3,20,28,.75), rgba(3,20,28,0)); }
.lbl.me-l .in { left: 0; transform: translate(-50%, -100%); border: 0; text-align: center; background: none; }
.lbl .t { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #cdeff7; text-shadow: 0 0 8px rgba(95,227,255,.7); }
.lbl .c { font-family: var(--mono); font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: #6f9fb0; }
.lbl:hover .t, .lbl.active .t, .lbl:focus-visible .t { color: #fff; }
.lbl.active .in { border-color: #fff; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; font-family: var(--mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--glow); pointer-events: none; }
@media (max-width: 760px) { .lbl .t { font-size: 9.5px; letter-spacing: .08em; } .lbl .c { display: none; } }

/* info panel */
.panel { position: absolute; top: 12px; right: max(20px, env(safe-area-inset-right, 0px)); bottom: 12px; width: min(400px, calc(100% - 40px)); overflow: auto; z-index: 5;
  background: var(--panel); border: 1px solid var(--line); box-shadow: 0 0 30px rgba(95,227,255,.12), inset 0 0 40px rgba(95,227,255,.04);
  padding: 20px 22px 24px; backdrop-filter: blur(6px); }
.ph { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
.label { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--glow); }
.close { background: none; border: 1px solid var(--line); color: var(--dim); font-family: var(--mono); font-size: 11px; letter-spacing: .1em; padding: 5px 10px; cursor: pointer; text-transform: uppercase; }
.close:hover { color: var(--glow); border-color: var(--glow); }
.panel h2 { font-family: var(--display); font-weight: 600; font-size: 25px; line-height: 1.12; margin: 6px 0 10px; color: #eaf8fc; text-wrap: balance; }
.panel h3 { font-family: var(--display); font-weight: 600; font-size: 17px; margin: 4px 0 6px; color: #eaf8fc; }
.panel p { margin: 0 0 12px; }
.panel ul.pts { margin: 0 0 14px; padding-left: 18px; }
.panel ul.pts li { margin-bottom: 6px; }
.st { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); border: 1px solid var(--line); padding: 2px 8px; display: inline-block; }
.st.live { color: var(--glow); border-color: var(--glow-soft); }
.med { font-size: 14px; color: var(--dim); border-left: 2px solid var(--glow); padding-left: 10px; margin: 0 0 14px; }
.med b { display: block; color: var(--glow); font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; font-weight: 500; }
.specs { display: flex; flex-wrap: wrap; gap: 6px; }
.specs span { font-family: var(--mono); font-size: 11px; color: var(--dim); border: 1px solid var(--line); padding: 3px 8px; }
.sub { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
.kv { display: grid; gap: 0; margin: 0 0 14px; border-top: 1px solid var(--line); }
.kv div { display: grid; grid-template-columns: 90px minmax(0,1fr); gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.kv dt { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); padding-top: 2px; }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.list { list-style: none; margin: 8px 0 0; padding: 0; }
.list button { width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 11px 2px; cursor: pointer; display: grid; grid-template-columns: 46px minmax(0,1fr) auto; gap: 10px; align-items: baseline; }
.list button:hover { background: rgba(95,227,255,.05); }
.list .c { font-family: var(--mono); font-size: 11px; color: var(--glow); }
.list .t { font-family: var(--display); font-weight: 600; font-size: 16px; color: #eaf8fc; }
.list .s { display: block; font-family: var(--body); font-weight: 400; font-size: 13px; color: var(--dim); }
.list .a { color: var(--dim); font-family: var(--mono); }
.demo, .ecg { border: 1px solid var(--line); background: #000; margin: 0 0 14px; }
.demo { padding: 10px; }
.demo svg { width: 100%; height: auto; display: block; }
.demo .row { display: flex; align-items: center; gap: 10px; }
.demo label { font-family: var(--mono); font-size: 10.5px; color: var(--dim); letter-spacing: .1em; text-transform: uppercase; }
.demo input { flex: 1; min-width: 0; accent-color: var(--glow); }
.demo output { font-family: var(--mono); font-size: 12px; color: var(--glow); font-variant-numeric: tabular-nums; min-width: 84px; text-align: right; }
.ecg { width: 100%; height: 54px; display: block; }
.ecg path { fill: none; stroke: var(--glow); stroke-width: 1.6; stroke-dasharray: 900; animation: trace 2.4s linear infinite; filter: drop-shadow(0 0 3px var(--glow)); }
@keyframes trace { from { stroke-dashoffset: 900; } to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .ecg path { animation: none; stroke-dasharray: none; } }

@media (max-width: 760px) {
  nav.subs button { padding: 9px 11px; font-size: 11px; letter-spacing: .08em; }
  .panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 72%; border-width: 1px 0 0;
    padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  .hint { font-size: 10px; letter-spacing: .06em; }
}
</style>
</head>
<body>

<div class="room">
  <header class="top">
    <div class="brand">Chanwoo Kim<span>ME · BU 2027</span></div>
    <nav class="subs" aria-label="Sections">
      <button type="button" data-sec="about" aria-pressed="false">About</button>
      <button type="button" data-sec="projects" aria-pressed="false">Projects</button>
      <button type="button" data-sec="research" aria-pressed="false">Research</button>
      <button type="button" data-sec="contact" aria-pressed="false">Contact</button>
    </nav>
  </header>

  <main class="stage">
    <div id="three" aria-label="3D lab scene: a glass capsule holding a human figure with a glowing nervous system, and Chanwoo in a lab coat reading a note. Drag to rotate."></div>
    <div id="labels">
      <button type="button" class="lbl node r" data-key="brain"><span class="in"><span class="t">Mission</span><span class="c">N-01</span></span></button>
      <button type="button" class="lbl node r" data-key="heart"><span class="in"><span class="t">Heart Rate Monitor</span><span class="c">N-02</span></span></button>
      <button type="button" class="lbl node r" data-key="core"><span class="in"><span class="t">Thermal Core</span><span class="c">N-04</span></span></button>
      <button type="button" class="lbl node r" data-key="hand"><span class="in"><span class="t">Soft Hands</span><span class="c">N-05</span></span></button>
      <button type="button" class="lbl node r" data-key="knee"><span class="in"><span class="t">Lower Limb</span><span class="c">N-07</span></span></button>
      <button type="button" class="lbl node l" data-key="eye"><span class="in"><span class="t">Mechatronics</span><span class="c">N-06</span></span></button>
      <button type="button" class="lbl node l" data-key="lung"><span class="in"><span class="t">Gait Thermodynamics</span><span class="c">N-03</span></span></button>
      <button type="button" class="lbl me-l" id="meBtn" data-key="me"><span class="in"><span class="t">Chanwoo Kim</span><span class="c">tap for profile</span></span></button>
    </div>
    <div id="loading" class="loading">Booting lab systems…</div>
    <p id="nogl" class="loading" hidden>This view needs WebGL. Use the menu above to browse everything.</p>
    <span class="hint">Drag to rotate · Tap an electrode or me</span>
  </main>

  <footer class="foot"><span>ckim1210@bu.edu</span><span>© 2026 Chanwoo Kim · Boston, MA</span></footer>

  <aside class="panel" id="panel" hidden aria-live="polite">
    <div class="ph"><span class="label" id="pLabel"></span><button class="close" id="pClose" type="button">Close ✕</button></div>
    <div id="pBody"></div>
  </aside>
</div>

<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const mk = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const N = {
    brain: { code: 'N-01', name: 'Mission', sub: 'Why medical robotics' },
    heart: { code: 'N-02', name: 'Heart Rate Monitor', sub: 'Wearable for elderly users' },
    lung:  { code: 'N-03', name: 'Gait Thermodynamics', sub: 'KAIST heat flux sensors' },
    core:  { code: 'N-04', name: 'Thermal Core', sub: 'Capstone heat recovery' },
    hand:  { code: 'N-05', name: 'Soft Hands', sub: 'Finger and gripper builds' },
    eye:   { code: 'N-06', name: 'Mechatronics', sub: 'Autonomous puck launcher' },
    knee:  { code: 'N-07', name: 'Lower Limb', sub: 'Fracture model and soft leg' }
  };

  // content
  const ecg = '<svg class="ecg" viewBox="0 0 300 54" preserveAspectRatio="none" aria-hidden="true"><path d="M0 30 H60 L70 30 L76 22 L82 30 H96 L102 30 L108 6 L116 50 L122 30 H136 L146 24 L156 30 H200 L210 30 L216 22 L222 30 H236 L242 30 L248 6 L256 50 L262 30 H276 L286 24 L296 30 H300"/></svg>';
  const finger = '<div class="demo"><svg viewBox="0 0 300 150" aria-label="Soft finger bending model"><rect x="8" y="58" width="30" height="44" fill="none" stroke="#5fe3ff" stroke-opacity=".5"/><g transform="translate(38,80)" fill="#000" stroke="#5fe3ff"><rect x="0" y="-10" width="70" height="20" rx="3"/><g id="fj1" transform="translate(78,0)"><ellipse class="fs" rx="9" ry="11"/><rect x="8" y="-9" width="58" height="18" rx="3"/><g id="fj2" transform="translate(74,0)"><ellipse class="fs" rx="8" ry="10"/><path d="M7 -8 H44 Q54 -8 54 0 Q54 8 44 8 H7 Z"/></g></g></g></svg><div class="row"><label for="fp">Pressure</label><input id="fp" type="range" min="0" max="100" value="35"><output id="fo"></output></div></div>';

  const C = {
    me: { label: 'Profile · Chanwoo Kim', html: `
      <h2>Chanwoo Kim</h2>
      <p>Mechanical Engineering student at Boston University building soft robots for the human body: actuators that are safe to touch, sensors that can be trusted on skin, and models of how the body takes load.</p>
      <dl class="kv">
        <div><dt>School</dt><dd>Boston University, College of Engineering · B.S. Mechanical Engineering, May 2027</dd></div>
        <div><dt>Standing</dt><dd>Dean's List, Fall 2024 to present · Last 60 credit GPA 3.94</dd></div>
        <div><dt>Lab</dt><dd>Frumkin Lab (Applied Interfacial Phenomena), BU</dd></div>
        <div><dt>Prior</dt><dd>KAIST Biomechanics Lab · ROK Army sergeant, combat medic</dd></div>
        <div><dt>Goal</dt><dd>Graduate research in prosthetics, rehabilitation and soft wearable devices</dd></div>
        <div><dt>Language</dt><dd>Korean (native) · English (full professional)</dd></div>
      </dl>
      <div class="specs"><span>SolidWorks</span><span>Onshape</span><span>MATLAB</span><span>Python</span><span>C/C++</span><span>LabVIEW</span><span>Arduino</span><span>PCB</span><span>Vicon</span></div>` },
    brain: { label: 'N-01 · Mission', html: `
      <h2>Medical robotics, built soft</h2>
      <p>Before engineering I served as a combat medic and company counselor in the Republic of Korea Army, responsible for a 10 person squad. Caring for bodies became the point of the work for me.</p>
      <p>Now I build hybrid soft actuators, rigid bones with air driven silicone joints, and I want to bring them into prosthetics, rehabilitation and medical devices where a robot has to be safe to touch.</p>
      <div class="specs"><span>Soft robotics</span><span>Prosthetics</span><span>Biomechanics</span><span>Mechatronics</span></div>` },
    heart: { label: 'N-02 · Cardiac', html: `
      <span class="st live">1st place · May 2025</span>
      <h2>Wearable Heart Rate Monitor</h2>
      ${ecg}
      <ul class="pts">
        <li>Designed for elderly users: Arduino Nano with dual pulse sensors, averaged for tolerance to motion noise</li>
        <li>Visual, auditory and haptic alerts so a warning reaches the wearer whatever their senses allow</li>
        <li>Rechargeable compact build in a laser cut enclosure; fixed power instability with an independent servo supply</li>
        <li>First place in the course wide final project competition, selected for display in the College of Engineering Hall</li>
      </ul>
      <p class="med"><b>Medical relevance</b>Reliable physiological sensing is the input every closed loop medical device depends on.</p>
      <div class="specs"><span>Arduino Nano</span><span>Pulse sensors</span><span>Signal averaging</span><span>Laser cutting</span></div>` },
    lung: { label: 'N-03 · KAIST Biomechanics Lab', html: `
      <span class="st">Jun to Aug 2025</span>
      <h2>Heat Flux Sensing of Human Gait</h2>
      <ul class="pts">
        <li>Calibrated wearable heat flux sensors for research on the thermodynamics of human walking, contributing to a master's thesis on lower limb heat flux during gait</li>
        <li>Proposed and built a PID controlled Peltier cold plate (driving circuit, custom PCB, LabVIEW) to validate sensor accuracy; found a confounding variable in conduction based control and pivoted to a new method</li>
        <li>Led a system identification experiment with step inputs at skin temperature, showing the heat flux sensor responds much faster than the temperature sensor and validating it for gait trials</li>
        <li>Set up Vicon motion capture, helped calibrate force plates, ran human subject experiments and presented findings at a lab seminar</li>
      </ul>
      <p class="med"><b>Medical relevance</b>Wearables only help patients if their sensors are characterized. This is the groundwork.</p>
      <div class="specs"><span>System ID</span><span>LabVIEW</span><span>PID</span><span>PCB</span><span>Vicon</span><span>Force plates</span></div>` },
    core: { label: 'N-04 · Senior Design', html: `
      <span class="st live">In progress · Fall 2026</span>
      <h2>Data Center Waste Heat Recovery</h2>
      <p>Six person capstone team developing a system to recover and reuse waste heat from a hyperscale data center, using water to water heat exchange to warm a treatment chamber where a yeast and water mixture produces gas.</p>
      <div class="specs"><span>Heat exchange</span><span>Thermal systems</span><span>Advisor: Prof. McDaniel</span></div>` },
    hand: { label: 'N-05 · Frumkin Lab', html: `
      <span class="st">P-01 · Completed</span>
      <h2>Two-Joint Hybrid Soft Finger</h2>
      ${finger}
      <p>Fabricated by fluidic shaping, which uses capillary self organization of liquids under neutral buoyancy. 3D printed rigid bones meet elastomer joints for both compliance and strength. Model above is illustrative.</p>
      <p class="med"><b>Medical relevance</b>Rigid structure plus compliant joints is a building block for soft prosthetic hands.</p>
      <div class="sub"><span class="st live">P-02 · In development</span><h3>Variable Stiffness Gripper</h3><p>Fiber integrated joints made from drop stitch fabric, compliant when vented and stiff when inflated, for tunable adaptive grasping.</p></div>
      <div class="sub"><span class="st">P-04 · Planned</span><h3>Three-Finger Silicone Gripper</h3><p>Ecoflex 00-30 cast in 3D printed molds and driven by a syringe pump, based on the open OptoLAB design.</p></div>
      <div class="sub"><span class="st">Lab work</span><h3>Topology Optimized Brackets</h3><p>Assisted in fabricating brackets by fluidic shaping.</p></div>` },
    eye: { label: 'N-06 · Mechatronics', html: `
      <span class="st">Dec 2025</span>
      <h2>Autonomous Puck Launching Game</h2>
      <ul class="pts">
        <li>Designed and built a 2.5 DOF Cartesian system: three stepper driven belt linear stages and a servo driven push pull mechanism that grabs, tensions and launches pucks</li>
        <li>MATLAB vision with camera calibration to detect and localize pucks, integrated with G-code control for autonomous retrieval and launch</li>
      </ul>
      <p class="med"><b>Medical relevance</b>Vision guided positioning and closed loop motion are the core of surgical and rehabilitation robots.</p>
      <div class="specs"><span>Stepper control</span><span>MATLAB vision</span><span>G-code</span></div>` },
    knee: { label: 'N-07 · Lower limb', html: `
      <span class="st">ME500 · Fall 2026</span>
      <h2>Critical Fall Height for Leg Fracture</h2>
      <p>Modeled the knee as a spring damper two bar linkage and the tibia as an Euler buckling column to estimate the landing height at which the leg fractures.</p>
      <p class="med"><b>Medical relevance</b>Lower limb devices live under impact loads. Knowing where bone fails sets their design limits.</p>

  const hit = new THREE.Mesh(new THREE.SphereGeometry(.07, 8, 6), new THREE.MeshBasicMaterial({ visible: false })); hit.userData.key = k; g.add(hit); hits.push(hit);
  const [px, pz] = posts[n.post], start = new THREE.Vector3(px * 1.07, n.p[1] + .35, pz * 1.07), end = new THREE.Vector3(n.p[0], n.p[1] + .19, n.p[2]);
  const mid = start.clone().lerp(end, .5); mid.y -= .18;
  cap.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([start, mid, end]), 40, .006, 6), new THREE.MeshStandardMaterial({ color: '#0c2f3c', emissive: '#1a6377', metalness: .5, roughness: .4 })));
  elWorld[k] = g;
});

// ---------- me: back view, reading a note ----------
const me = new THREE.Group(); me.position.set(2.05, 0, .45); me.rotation.y = Math.PI + .5; scene.add(me);
lathe([[.0, .62], [.215, .62], [.2, .8], [.18, 1.0], [.17, 1.12], [.19, 1.3], [.205, 1.42], [.16, 1.47], [.07, 1.5], [0, 1.51]], coatM, me, .66);
for (const s of [-1, 1]) {
  limb([s * .09, .64, 0], [s * .095, .1, -.01], .068, .058, coatM, me);
  ball([s * .1, .05, .04], .055, coatM, me, [.95, .62, 1.9]);
  ball([s * .2, 1.42, -.01], .06, coatM, me);
  limb([s * .2, 1.42, -.01], [s * .23, 1.16, -.05], .062, .055, coatM, me);
  limb([s * .23, 1.16, -.05], [s * .1, 1.2, .24], .052, .044, coatM, me);
  ball([s * .09, 1.21, .26], .035, coatM, me);
}
limb([0, 1.5, 0], [0, 1.57, .02], .052, .048, coatM, me);
const head = ball([0, 1.665, .045], .1, holo('#bff6ff', .9, .03, 2.4), me, [.9, 1.08, 1]); head.rotation.x = .35;
const hair = new THREE.Mesh(new THREE.SphereGeometry(.112, 32, 24, 0, Math.PI * 2, 0, Math.PI * .66), new THREE.MeshStandardMaterial({ color: '#0b2c38', emissive: '#0a3442', roughness: .9, side: THREE.DoubleSide }));
hair.position.set(0, 1.675, .035); hair.rotation.x = -.55; hair.scale.set(.9, 1.06, 1); me.add(hair);
// clipboard
const cb = new THREE.Group(); cb.position.set(0, 1.24, .3); cb.rotation.x = -.7; me.add(cb);
boxEdges(.24, .32, .012, [0, 0, 0], .95, cb);
boxEdges(.08, .03, .02, [0, .16, .005], .95, cb);
for (let i = 0; i < 5; i++) line([[-.09, .1 - i * .045, .008], [.09 - (i % 2) * .05, .1 - i * .045, .008]], lineM(.6), cb);
// coat details on the back (local -z faces the camera)
line([[0, 1.36, -.135], [0, .9, -.13], [0, .63, -.142]], lineM(.7), me);
boxEdges(.16, .035, .01, [0, 1.06, -.122], .9, me, false);
line(curve([[-.13, 1.48, -.05], [0, 1.43, -.11], [.13, 1.48, -.05]]).getPoints(16), lineM(.7), me);
const meHit = new THREE.Mesh(new THREE.BoxGeometry(.6, 1.8, .6), new THREE.MeshBasicMaterial({ visible: false })); meHit.position.y = .9; meHit.userData.key = 'me'; me.add(meHit); hits.push(meHit);
const shadow = new THREE.Mesh(new THREE.CircleGeometry(.4, 32), new THREE.MeshBasicMaterial({ color: '#000', transparent: true, opacity: .35 })); shadow.rotation.x = -Math.PI / 2; shadow.position.y = .004; me.add(shadow);

// ---------- pulses ----------
const pulses = [];
if (!reduce) {
  const pm = new THREE.MeshBasicMaterial({ color: '#ffffff' });
  for (let i = 0; i < 26; i++) { const m = new THREE.Mesh(new THREE.SphereGeometry(.007, 8, 6), pm); nerves.add(m); pulses.push({ m, c: routes[i % routes.length], t: Math.random(), v: .004 + Math.random() * .006, rev: Math.random() < .4 }); }
}

// ---------- labels ----------
const labelEls = {};
document.querySelectorAll('#labels [data-key]').forEach(el => labelEls[el.dataset.key] = el);
const v = new THREE.Vector3();
function placeLabels(w, h) {
  for (const k in labelEls) {
    const el = labelEls[k];
    if (k === 'me') { v.set(0, 1.92, 0); me.localToWorld(v); }
    else elWorld[k].getWorldPosition(v);
    v.project(camera);
    if (v.z > 1) { el.style.visibility = 'hidden'; continue; }
    el.style.visibility = 'visible';
    el.style.transform = `translate(${((v.x + 1) / 2 * w).toFixed(1)}px, ${((1 - v.y) / 2 * h).toFixed(1)}px)`;
  }
}

// ---------- interaction ----------
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => downAt = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(hits, false)[0];
  if (hit && window.showNode) window.showNode(hit.object.userData.key);
});
renderer.domElement.addEventListener('pointermove', e => {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  renderer.domElement.style.cursor = ray.intersectObjects(hits, false).length ? 'pointer' : 'grab';
});

// ---------- sizing ----------
let W = 1, Hh = 1;
function resize() {
  W = host.clientWidth || 1; Hh = host.clientHeight || 1;
  renderer.setSize(W, Hh); composer.setSize(W, Hh); bloom.setSize(W, Hh);
  camera.aspect = W / Hh;
  const narrow = camera.aspect < 1;
  camera.fov = narrow ? 52 : 38; camera.updateProjectionMatrix();
  if (!resize.done) { camera.position.set(narrow ? 1.4 : 1.15, 1.45, narrow ? 6.8 : 4.7); resize.done = true; }
  controls.target.set(narrow ? 1.0 : .95, narrow ? 1.25 : 1.12, 0);
}
new ResizeObserver(resize).observe(host); resize();

// ---------- loop ----------
const clock = new THREE.Clock();
function frame() {
  const t = clock.getElapsedTime();
  if (!reduce) {
    scan.position.y = H0 + .05 + (Math.sin(t * .6) * .5 + .5) * (H1 - H0 - .1);
    pulses.forEach(p => { p.t += p.v; if (p.t > 1) { p.t = 0; p.c = routes[Math.floor(Math.random() * routes.length)]; } p.m.position.copy(p.c.getPointAt(p.rev ? 1 - p.t : p.t)); });
    const beat = 1 + Math.max(0, Math.sin(t * 7.5)) ** 8 * .9; NODES.heart.dot.scale.setScalar(beat);
    halo.material.opacity = .18 + Math.sin(t * 1.2) * .08;
  }
  controls.update();
  composer.render();
  placeLabels(W, Hh);
  requestAnimationFrame(frame);
}
frame();
document.getElementById('loading').hidden = true;
</script>
</body>
