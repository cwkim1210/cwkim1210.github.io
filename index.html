<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chanwoo Kim Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Chanwoo Kim, Mechanical Engineering at Boston University. Soft robotics for prosthetics, rehabilitation and medical devices.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one dark room. Left, a suit storage capsule holding a body with a glowing nervous system; right, Chanwoo in a lab coat holding a note; menu bar top right. Black and one cyan glow only. */
:root {
  --black: #000000;
  --panel: rgba(2, 10, 14, 0.94);
  --line: rgba(95, 227, 255, 0.22);
  --glow: #5fe3ff;
  --glow-soft: rgba(95, 227, 255, 0.55);
  --text: #cfeaf3;
  --dim: #6f8f9c;
  --display: "Chakra Petch", "Eurostile", "Arial Narrow", sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--black); color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.55; overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }
a { color: var(--glow); text-underline-offset: 3px; }

.room { position: relative; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px 24px; flex-wrap: wrap;
  padding-block: 16px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.brand { font-family: var(--display); font-weight: 700; letter-spacing: .2em; text-transform: uppercase; font-size: 14px; color: var(--glow); text-shadow: 0 0 10px var(--glow-soft); }
.brand span { color: var(--dim); text-shadow: none; font-weight: 500; letter-spacing: .14em; font-size: 11px; font-family: var(--mono); margin-left: 10px; }
nav.subs { display: flex; border: 1px solid var(--line); box-shadow: 0 0 18px rgba(95,227,255,.08) inset; }
nav.subs button { background: none; border: 0; border-left: 1px solid var(--line); padding: 10px 18px; cursor: pointer;
  font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
nav.subs button:first-child { border-left: 0; }
nav.subs button:hover, nav.subs button[aria-pressed=true] { color: var(--glow); text-shadow: 0 0 8px var(--glow-soft); background: rgba(95,227,255,.05); }

.stage { position: relative; min-height: 0; }
#scene { width: 100%; height: 100%; display: block; }
.hint { position: absolute; left: max(20px, env(safe-area-inset-left, 0px)); top: 4px; font-family: var(--mono); font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
.foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 16px; font-family: var(--mono); font-size: 11px; color: var(--dim);
  padding-block: 12px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); border-top: 1px solid var(--line); }

/* svg pieces */
.glowline { filter: drop-shadow(0 0 4px var(--glow)) drop-shadow(0 0 10px rgba(95,227,255,.35)); }
.hit { cursor: pointer; }
.node .ring { fill: none; stroke: var(--glow); stroke-width: 1; transform-box: fill-box; transform-origin: center; animation: ping 2.6s ease-out infinite; }
.node .dot { fill: var(--glow); }
.node .core { fill: #000; stroke: var(--glow); stroke-width: 1.5; }
.node text, .tag text { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; fill: var(--dim); text-transform: uppercase; }
.node:hover .core, .node.active .core { fill: var(--glow); }
.node:hover text, .node.active text, .me:hover .tag text, .me.active .tag text { fill: var(--glow); }
.node.heart .dot { transform-box: fill-box; transform-origin: center; animation: beat 1s ease-in-out infinite; }
.node:focus, .me:focus { outline: none; }
.node:focus-visible .core { stroke-width: 3; }
.me:hover .body, .me.active .body, .me:focus-visible .body { filter: drop-shadow(0 0 6px var(--glow)) drop-shadow(0 0 18px rgba(95,227,255,.6)); }
.scanring { animation: scan 6s ease-in-out infinite alternate; }
@keyframes scan { from { transform: translateY(0); } to { transform: translateY(410px); } }
@keyframes ping { 0% { transform: scale(.8); opacity: .9; } 100% { transform: scale(2.2); opacity: 0; } }
@keyframes beat { 0%, 60%, 100% { transform: scale(1); } 15% { transform: scale(1.6); } 30% { transform: scale(1.1); } 45% { transform: scale(1.4); } }
@media (prefers-reduced-motion: reduce) { .node .ring, .node.heart .dot, .scanring { animation: none; } }

/* info panel */
.panel { position: absolute; top: 12px; right: max(20px, env(safe-area-inset-right, 0px)); bottom: 12px; width: min(400px, calc(100% - 40px)); overflow: auto; z-index: 5;
  background: var(--panel); border: 1px solid var(--line); box-shadow: 0 0 30px rgba(95,227,255,.12), inset 0 0 40px rgba(95,227,255,.04);
  padding: 20px 22px 24px; backdrop-filter: blur(6px); }
.ph { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
.label { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--glow); }
.close { background: none; border: 1px solid var(--line); color: var(--dim); font-family: var(--mono); font-size: 11px; letter-spacing: .1em; padding: 5px 10px; cursor: pointer; text-transform: uppercase; }
.close:hover { color: var(--glow); border-color: var(--glow); }
.panel h2 { font-family: var(--display); font-weight: 600; font-size: 25px; line-height: 1.12; margin: 6px 0 10px; color: #eaf8fc; text-wrap: balance; }
.panel h3 { font-family: var(--display); font-weight: 600; font-size: 17px; margin: 4px 0 6px; color: #eaf8fc; }
.panel p { margin: 0 0 12px; }
.panel ul.pts { margin: 0 0 14px; padding-left: 18px; }
.panel ul.pts li { margin-bottom: 6px; }
.st { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); border: 1px solid var(--line); padding: 2px 8px; display: inline-block; }
.st.live { color: var(--glow); border-color: var(--glow-soft); }
.med { font-size: 14px; color: var(--dim); border-left: 2px solid var(--glow); padding-left: 10px; margin: 0 0 14px; }
.med b { display: block; color: var(--glow); font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; font-weight: 500; }
.specs { display: flex; flex-wrap: wrap; gap: 6px; }
.specs span { font-family: var(--mono); font-size: 11px; color: var(--dim); border: 1px solid var(--line); padding: 3px 8px; }
.sub { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
.kv { display: grid; gap: 0; margin: 0 0 14px; border-top: 1px solid var(--line); }
.kv div { display: grid; grid-template-columns: 90px minmax(0,1fr); gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.kv dt { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); padding-top: 2px; }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.list { list-style: none; margin: 8px 0 0; padding: 0; }
.list button { width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 11px 2px; cursor: pointer; display: grid; grid-template-columns: 46px minmax(0,1fr) auto; gap: 10px; align-items: baseline; }
.list button:hover { background: rgba(95,227,255,.05); }
.list .c { font-family: var(--mono); font-size: 11px; color: var(--glow); }
.list .t { font-family: var(--display); font-weight: 600; font-size: 16px; color: #eaf8fc; }
.list .s { display: block; font-family: var(--body); font-weight: 400; font-size: 13px; color: var(--dim); }
.list .a { color: var(--dim); font-family: var(--mono); }
.demo, .ecg { border: 1px solid var(--line); background: #000; margin: 0 0 14px; }
.demo { padding: 10px; }
.demo svg { width: 100%; height: auto; display: block; }
.demo .row { display: flex; align-items: center; gap: 10px; }
.demo label { font-family: var(--mono); font-size: 10.5px; color: var(--dim); letter-spacing: .1em; text-transform: uppercase; }
.demo input { flex: 1; min-width: 0; accent-color: var(--glow); }
.demo output { font-family: var(--mono); font-size: 12px; color: var(--glow); font-variant-numeric: tabular-nums; min-width: 84px; text-align: right; }
.ecg { width: 100%; height: 54px; display: block; }
.ecg path { fill: none; stroke: var(--glow); stroke-width: 1.6; stroke-dasharray: 900; animation: trace 2.4s linear infinite; filter: drop-shadow(0 0 3px var(--glow)); }
@keyframes trace { from { stroke-dashoffset: 900; } to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .ecg path { animation: none; stroke-dasharray: none; } }

@media (max-width: 760px) {
  nav.subs button { padding: 9px 11px; font-size: 11px; letter-spacing: .08em; }
  .panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 72%; border-width: 1px 0 0;
    padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  .hint { font-size: 10px; letter-spacing: .06em; }
}
</style>
</head>
<body>

<div class="room">
  <header class="top">
    <div class="brand">Chanwoo Kim<span>ME · BU 2027</span></div>
    <nav class="subs" aria-label="Sections">
      <button type="button" data-sec="about" aria-pressed="false">About</button>
      <button type="button" data-sec="projects" aria-pressed="false">Projects</button>
      <button type="button" data-sec="research" aria-pressed="false">Research</button>
      <button type="button" data-sec="contact" aria-pressed="false">Contact</button>
    </nav>
  </header>

  <main class="stage">
    <svg id="scene" viewBox="20 26 840 584" preserveAspectRatio="xMidYMid meet" role="group" aria-label="A capsule holding a robotic body with glowing nerves, and Chanwoo in a lab coat holding a note">
      <defs>
        <linearGradient id="glass" x1="0" x2="1">
          <stop offset="0" stop-color="#5fe3ff" stop-opacity=".10"/>
          <stop offset=".12" stop-color="#5fe3ff" stop-opacity=".02"/>
          <stop offset=".78" stop-color="#5fe3ff" stop-opacity=".0"/>
          <stop offset=".9" stop-color="#5fe3ff" stop-opacity=".07"/>
          <stop offset="1" stop-color="#5fe3ff" stop-opacity=".12"/>
        </linearGradient>
        <filter id="dilate" x="-10%" y="-10%" width="120%" height="120%"><feMorphology operator="dilate" radius="1.6"/></filter>
        <radialGradient id="floor"><stop offset="0" stop-color="#5fe3ff" stop-opacity=".35"/><stop offset="1" stop-color="#5fe3ff" stop-opacity="0"/></radialGradient>
        <clipPath id="tankClip"><path d="M140 100 V552 A130 22 0 0 0 400 552 V100 A130 22 0 0 0 140 100 Z"/></clipPath>

        <!-- capsule body geometry -->
        <g id="android">
          <ellipse cx="270" cy="150" rx="25" ry="31"/>
          <rect x="259" y="172" width="22" height="34" rx="8"/>
          <path d="M226 202 Q270 190 314 202 Q324 214 320 246 Q308 296 302 336 L306 372 H234 L238 336 Q232 296 220 246 Q216 214 226 202 Z"/>
          <polyline points="228,212 204,296 192,376" fill="none" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="312,212 336,296 348,376" fill="none" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="252,362 248,450 246,528" fill="none" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="288,362 292,450 294,528" fill="none" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <!-- me in a lab coat -->
        <g id="me">
          <circle cx="720" cy="214" r="25"/>
          <rect x="710" y="234" width="20" height="22" rx="6"/>
          <polyline points="704,474 702,560" fill="none" stroke-width="20" stroke-linecap="round"/>
          <polyline points="736,474 738,560" fill="none" stroke-width="20" stroke-linecap="round"/>
          <path d="M688 256 Q720 246 752 256 L760 300 L774 486 Q720 498 666 486 L680 300 Z"/>
          <polyline points="752,266 768,352 762,420" fill="none" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="690,266 660,330 626,322" fill="none" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </defs>

      <!-- floor glow -->
      <ellipse cx="270" cy="560" rx="200" ry="30" fill="url(#floor)"/>
      <ellipse cx="720" cy="566" rx="90" ry="14" fill="url(#floor)" opacity=".6"/>

      <!-- capsule: back half -->
      <path d="M140 552 A130 22 0 0 1 400 552" fill="none" stroke="#5fe3ff" stroke-opacity=".25"/>
      <path d="M140 100 A130 22 0 0 1 400 100" fill="none" stroke="#5fe3ff" stroke-opacity=".35"/>
      <rect x="140" y="100" width="260" height="452" fill="url(#glass)"/>

      <!-- android: outline by union trick -->
      <g class="glowline">
        <use href="#android" fill="#5fe3ff" stroke="#5fe3ff" filter="url(#dilate)"/>
      </g>
      <use href="#android" fill="#000" stroke="#000"/>
      <g id="nerves" stroke="#5fe3ff" stroke-opacity=".5" stroke-width="1" fill="none"></g>
      <g id="pulses" fill="#5fe3ff"></g>

      <!-- capsule: front half -->
      <g clip-path="url(#tankClip)"><ellipse class="scanring" cx="270" cy="120" rx="130" ry="22" fill="none" stroke="#5fe3ff" stroke-opacity=".35"/></g>
      <g fill="none" stroke="#5fe3ff" class="glowline">
        <line x1="140" y1="100" x2="140" y2="552" stroke-opacity=".7"/>
        <line x1="400" y1="100" x2="400" y2="552" stroke-opacity=".7"/>
        <path d="M140 100 A130 22 0 0 0 400 100" stroke-opacity=".8"/>
        <path d="M140 552 A130 22 0 0 0 400 552" stroke-opacity=".8"/>
      </g>
      <path d="M128 92 A142 26 0 0 1 412 92 V80 A142 26 0 0 0 128 80 Z" fill="#000" stroke="#5fe3ff" stroke-opacity=".6"/>
      <path d="M128 560 A142 26 0 0 0 412 560 V578 A142 26 0 0 1 128 578 Z" fill="#000" stroke="#5fe3ff" stroke-opacity=".6"/>
      <line x1="160" y1="130" x2="160" y2="520" stroke="#5fe3ff" stroke-opacity=".12" stroke-width="5"/>
      <g font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="2" fill="#6f8f9c">
        <text x="270" y="40" text-anchor="middle">UNIT CK-01 · SOFT BIOMECHANICAL</text>
      </g>

      <g id="nodes"></g>

      <!-- me -->
      <g class="me hit" id="meBtn" tabindex="0" role="button" aria-label="Chanwoo Kim, open my info">
        <rect x="560" y="170" width="230" height="400" fill="transparent"/>
        <g class="body">
          <g class="glowline"><use href="#me" fill="#5fe3ff" stroke="#5fe3ff" filter="url(#dilate)"/></g>
          <use href="#me" fill="#000" stroke="#000"/>
          <!-- coat details -->
          <g fill="none" stroke="#5fe3ff" stroke-opacity=".6" stroke-width="1.2">
            <path d="M708 256 L720 292 L732 256"/>
            <line x1="720" y1="292" x2="716" y2="488"/>
            <line x1="742" y1="380" x2="758" y2="380"/>
            <circle cx="722" cy="318" r="1.6"/><circle cx="721" cy="360" r="1.6"/><circle cx="720" cy="402" r="1.6"/>
          </g>
          <!-- note -->
          <g transform="rotate(-8 600 310)">
            <rect x="572" y="276" width="56" height="74" fill="#000" stroke="#5fe3ff" stroke-width="1.6" class="glowline"/>
            <g stroke="#5fe3ff" stroke-opacity=".55"><line x1="580" y1="292" x2="618" y2="292"/><line x1="580" y1="304" x2="614" y2="304"/><line x1="580" y1="316" x2="620" y2="316"/><line x1="580" y1="328" x2="606" y2="328"/></g>
          </g>
        </g>
        <g class="tag"><text x="720" y="166" text-anchor="middle">Chanwoo Kim · Engineer</text></g>
      </g>
    </svg>
    <span class="hint">Tap a nerve node · Tap me for my info</span>
  </main>

  <footer class="foot"><span>ckim1210@bu.edu</span><span>© 2026 Chanwoo Kim · Boston, MA</span></footer>

  <aside class="panel" id="panel" hidden aria-live="polite">
    <div class="ph"><span class="label" id="pLabel"></span><button class="close" id="pClose" type="button">Close ✕</button></div>
    <div id="pBody"></div>
  </aside>
</div>

<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const mk = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // nerve network inside the android
  const P = {
    brain: [270,146], neck: [270,190], chest: [270,222], heart: [258,240], lung: [286,262], core: [270,312], pelvis: [270,352],
    shL: [232,214], elL: [205,296], eye: [192,372], shR: [308,214], elR: [335,296], hand: [348,372],
    hipL: [254,362], knL: [249,450], ftL: [246,522], hipR: [286,362], knee: [292,450], ftR: [294,522]
  };
  const E = [['brain','neck'],['neck','chest'],['chest','heart'],['chest','lung'],['heart','core'],['lung','core'],['core','pelvis'],
    ['chest','shL'],['shL','elL'],['elL','eye'],['chest','shR'],['shR','elR'],['elR','hand'],
    ['pelvis','hipL'],['hipL','knL'],['knL','ftL'],['pelvis','hipR'],['hipR','knee'],['knee','ftR'],['heart','lung'],['neck','shL'],['neck','shR']];
  const nerves = $('nerves');
  E.forEach(([a,b]) => {
    const A = P[a], B = P[b], mx = (A[0]+B[0])/2 + (A[1]-B[1])*0.08, my = (A[1]+B[1])/2 + (B[0]-A[0])*0.08;
    mk('path', { d: `M${A[0]} ${A[1]} Q${mx} ${my} ${B[0]} ${B[1]}` }, nerves);
  });
  [[258,136],[282,136],[262,160],[280,160],[270,130]].forEach(p => mk('line', { x1: p[0], y1: p[1], x2: 270, y2: 146 }, nerves));

  const N = {
    brain: { code: 'N-01', name: 'Mission', sub: 'Why medical robotics', side: 'r' },
    heart: { code: 'N-02', name: 'Heart Rate Monitor', sub: 'Wearable for elderly users', side: 'r' },
    lung:  { code: 'N-03', name: 'Gait Thermodynamics', sub: 'KAIST heat flux sensors', side: 'r' },
    core:  { code: 'N-04', name: 'Thermal Core', sub: 'Capstone heat recovery', side: 'r' },
    hand:  { code: 'N-05', name: 'Soft Hands', sub: 'Finger and gripper builds', side: 'r' },
    eye:   { code: 'N-06', name: 'Mechatronics', sub: 'Autonomous puck launcher', side: 'l' },
    knee:  { code: 'N-07', name: 'Lower Limb', sub: 'Fracture model and soft leg', side: 'r' }
  };
  const nodesG = $('nodes');
  Object.entries(N).forEach(([k, n]) => {
    const [x, y] = P[k];
    const g = mk('g', { class: 'node hit' + (k === 'heart' ? ' heart' : ''), tabindex: 0, role: 'button', 'aria-label': n.name, 'data-key': k }, nodesG);
    const r = n.side === 'r', tx = r ? 416 : 124;
    mk('line', { x1: x + (r ? 10 : -10), y1: y, x2: tx + (r ? -6 : 6), y2: y, stroke: '#5fe3ff', 'stroke-opacity': .25, 'stroke-dasharray': '2 3' }, g);
    mk('circle', { class: 'ring', cx: x, cy: y, r: 8 }, g);
    mk('circle', { class: 'core', cx: x, cy: y, r: 7 }, g);
    mk('circle', { class: 'dot', cx: x, cy: y, r: 3 }, g);
    mk('circle', { cx: x, cy: y, r: 16, fill: 'transparent' }, g);
    const t = mk('text', { x: tx, y: y + 3, 'text-anchor': r ? 'start' : 'end' }, g); t.textContent = n.name;
    g.addEventListener('click', () => show(k));
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(k); } });
  });

  if (!reduce) {
    const pg = $('pulses');
    const ps = Array.from({ length: 18 }, () => ({ el: mk('circle', { r: 2 }, pg) }));
    const reset = p => { p.e = E[Math.floor(Math.random() * E.length)]; if (Math.random() < .5) p.e = [p.e[1], p.e[0]]; p.t = 0; p.s = .005 + Math.random() * .01; };
    ps.forEach(p => { reset(p); p.t = Math.random(); });
    (function loop() {
      ps.forEach(p => {
        p.t += p.s; if (p.t >= 1) reset(p);
        const A = P[p.e[0]], B = P[p.e[1]], t = p.t;
        const mx = (A[0]+B[0])/2 + (A[1]-B[1])*0.08, my = (A[1]+B[1])/2 + (B[0]-A[0])*0.08;
        const x = (1-t)*(1-t)*A[0] + 2*(1-t)*t*mx + t*t*B[0], y = (1-t)*(1-t)*A[1] + 2*(1-t)*t*my + t*t*B[1];
        p.el.setAttribute('cx', x.toFixed(1)); p.el.setAttribute('cy', y.toFixed(1)); p.el.setAttribute('opacity', Math.sin(t * Math.PI).toFixed(2));
      });
      requestAnimationFrame(loop);
    })();
  }

  // content
  const ecg = '<svg class="ecg" viewBox="0 0 300 54" preserveAspectRatio="none" aria-hidden="true"><path d="M0 30 H60 L70 30 L76 22 L82 30 H96 L102 30 L108 6 L116 50 L122 30 H136 L146 24 L156 30 H200 L210 30 L216 22 L222 30 H236 L242 30 L248 6 L256 50 L262 30 H276 L286 24 L296 30 H300"/></svg>';

  const listOf = keys => '<ul class="list">' + keys.map(k => `<li><button type="button" data-go="${k}"><span class="c">${N[k].code}</span><span class="t">${N[k].name}<span class="s">${N[k].sub}</span></span><span class="a">→</span></button></li>`).join('') + '</ul>';

  const panel = $('panel'), meBtn = $('meBtn');
  function render(c, activeKey, sec) {
    $('pLabel').textContent = c.label; $('pBody').innerHTML = c.html; panel.hidden = false; panel.scrollTop = 0;
    document.querySelectorAll('.node').forEach(n => n.classList.toggle('active', n.dataset.key === activeKey));
    meBtn.classList.toggle('active', activeKey === 'me');
    document.querySelectorAll('nav.subs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.sec === sec ? 'true' : 'false'));
    panel.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => show(b.dataset.go)));
    const fp = $('fp');
    if (fp) {
      const f = () => { const p = fp.value / 100; $('fj1').setAttribute('transform', 'translate(78,0) rotate(' + (62*p).toFixed(1) + ')'); $('fj2').setAttribute('transform', 'translate(74,0) rotate(' + (78*p).toFixed(1) + ')'); document.querySelectorAll('.fs').forEach(s => s.setAttribute('fill', 'rgba(95,227,255,' + (.08 + .5*p).toFixed(2) + ')')); $('fo').textContent = Math.round(62*p) + '° / ' + Math.round(78*p) + '°'; };
      fp.addEventListener('input', f); f();
    }
  }
  function show(k) { render(C[k], k, k === 'me' ? 'about' : null); }
  function close() { panel.hidden = true; document.querySelectorAll('.node').forEach(n => n.classList.remove('active')); meBtn.classList.remove('active'); document.querySelectorAll('nav.subs button').forEach(b => b.setAttribute('aria-pressed', 'false')); }
  meBtn.addEventListener('click', () => show('me'));
  meBtn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show('me'); } });
  document.querySelectorAll('nav.subs button').forEach(b => b.addEventListener('click', () => { const c = S[b.dataset.sec](); render(c, b.dataset.sec === 'about' ? 'me' : null, b.dataset.sec); }));
  $('pClose').addEventListener('click', close);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !panel.hidden) close(); });
})();
</script>
