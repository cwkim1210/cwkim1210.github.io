<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chanwoo Kim Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Chanwoo Kim, Mechanical Engineering at Boston University. Soft robotics for prosthetics, rehabilitation and medical devices.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one dark room. Left, a suit storage capsule holding a body with a glowing nervous system; right, Chanwoo in a lab coat holding a note; menu bar top right. Black and one cyan glow only. */
:root {
  --black: #000000;
  --panel: rgba(2, 10, 14, 0.94);
  --line: rgba(95, 227, 255, 0.22);
  --glow: #5fe3ff;
  --glow-soft: rgba(95, 227, 255, 0.55);
  --text: #cfeaf3;
  --dim: #6f8f9c;
  --display: "Chakra Petch", "Eurostile", "Arial Narrow", sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: #041520; color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.55; overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }
a { color: var(--glow); text-underline-offset: 3px; }

.room { position: relative; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px 24px; flex-wrap: wrap;
  padding-block: 16px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.brand { font-family: var(--display); font-weight: 700; letter-spacing: .2em; text-transform: uppercase; font-size: 14px; color: var(--glow); text-shadow: 0 0 10px var(--glow-soft); }
.brand span { color: var(--dim); text-shadow: none; font-weight: 500; letter-spacing: .14em; font-size: 11px; font-family: var(--mono); margin-left: 10px; }
nav.subs { display: flex; border: 1px solid var(--line); box-shadow: 0 0 18px rgba(95,227,255,.08) inset; }
nav.subs button { background: none; border: 0; border-left: 1px solid var(--line); padding: 10px 18px; cursor: pointer;
  font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
nav.subs button:first-child { border-left: 0; }
nav.subs button:hover, nav.subs button[aria-pressed=true] { color: var(--glow); text-shadow: 0 0 8px var(--glow-soft); background: rgba(95,227,255,.05); }

.stage { position: relative; min-height: 0; }
#scene { width: 100%; height: 100%; display: block; }
.hint { position: absolute; left: max(20px, env(safe-area-inset-left, 0px)); top: 4px; font-family: var(--mono); font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
.foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 16px; font-family: var(--mono); font-size: 11px; color: var(--dim);
  padding-block: 12px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); border-top: 1px solid var(--line); }

/* svg pieces */
.glow-soft { filter: drop-shadow(0 0 3px rgba(143,240,255,.9)) drop-shadow(0 0 10px rgba(95,227,255,.45)); }
.lamp rect { filter: drop-shadow(0 0 8px #bff6ff) drop-shadow(0 0 22px #5fe3ff); }
.hit { cursor: pointer; }
.node .ring { fill: none; stroke: #bff6ff; stroke-width: 1; transform-box: fill-box; transform-origin: center; animation: ping 2.6s ease-out infinite; }
.node .dot { fill: #e8fdff; }
.node .core { fill: #04222e; stroke: #bff6ff; stroke-width: 1.5; filter: drop-shadow(0 0 4px #5fe3ff); }
.node text, .tag text { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; fill: #bfe9f3; text-transform: uppercase; paint-order: stroke; stroke: #041520; stroke-width: 4px; stroke-linejoin: round; }
.node text.sub, .tag text.tag2 { font-size: 8.5px; fill: #6f9fb0; letter-spacing: .18em; }
.node:hover .core, .node.active .core { fill: #bff6ff; }
.node:hover text, .node.active text, .me:hover .tag text, .me.active .tag text { fill: #ffffff; }
.node.heart .dot { transform-box: fill-box; transform-origin: center; animation: beat 1s ease-in-out infinite; }
.node:focus, .me:focus { outline: none; }
.node:focus-visible .core { stroke-width: 3; }
.me .body { filter: drop-shadow(0 0 3px rgba(143,240,255,.8)) drop-shadow(0 0 10px rgba(95,227,255,.35)); transition: filter .2s; }
.me:hover .body, .me.active .body, .me:focus-visible .body { filter: drop-shadow(0 0 5px #bff6ff) drop-shadow(0 0 20px rgba(95,227,255,.75)); }
.scanring { animation: scan 6s ease-in-out infinite alternate; }
@keyframes scan { from { transform: translateY(0); } to { transform: translateY(430px); } }
@keyframes ping { 0% { transform: scale(.8); opacity: .9; } 100% { transform: scale(2.2); opacity: 0; } }
@keyframes beat { 0%, 60%, 100% { transform: scale(1); } 15% { transform: scale(1.6); } 30% { transform: scale(1.1); } 45% { transform: scale(1.4); } }
@media (prefers-reduced-motion: reduce) { .node .ring, .node.heart .dot, .scanring { animation: none; } }

/* info panel */
.panel { position: absolute; top: 12px; right: max(20px, env(safe-area-inset-right, 0px)); bottom: 12px; width: min(400px, calc(100% - 40px)); overflow: auto; z-index: 5;
  background: var(--panel); border: 1px solid var(--line); box-shadow: 0 0 30px rgba(95,227,255,.12), inset 0 0 40px rgba(95,227,255,.04);
  padding: 20px 22px 24px; backdrop-filter: blur(6px); }
.ph { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
.label { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--glow); }
.close { background: none; border: 1px solid var(--line); color: var(--dim); font-family: var(--mono); font-size: 11px; letter-spacing: .1em; padding: 5px 10px; cursor: pointer; text-transform: uppercase; }
.close:hover { color: var(--glow); border-color: var(--glow); }
.panel h2 { font-family: var(--display); font-weight: 600; font-size: 25px; line-height: 1.12; margin: 6px 0 10px; color: #eaf8fc; text-wrap: balance; }
.panel h3 { font-family: var(--display); font-weight: 600; font-size: 17px; margin: 4px 0 6px; color: #eaf8fc; }
.panel p { margin: 0 0 12px; }
.panel ul.pts { margin: 0 0 14px; padding-left: 18px; }
.panel ul.pts li { margin-bottom: 6px; }
.st { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); border: 1px solid var(--line); padding: 2px 8px; display: inline-block; }
.st.live { color: var(--glow); border-color: var(--glow-soft); }
.med { font-size: 14px; color: var(--dim); border-left: 2px solid var(--glow); padding-left: 10px; margin: 0 0 14px; }
.med b { display: block; color: var(--glow); font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; font-weight: 500; }
.specs { display: flex; flex-wrap: wrap; gap: 6px; }
.specs span { font-family: var(--mono); font-size: 11px; color: var(--dim); border: 1px solid var(--line); padding: 3px 8px; }
.sub { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
.kv { display: grid; gap: 0; margin: 0 0 14px; border-top: 1px solid var(--line); }
.kv div { display: grid; grid-template-columns: 90px minmax(0,1fr); gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.kv dt { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); padding-top: 2px; }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.list { list-style: none; margin: 8px 0 0; padding: 0; }
.list button { width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 11px 2px; cursor: pointer; display: grid; grid-template-columns: 46px minmax(0,1fr) auto; gap: 10px; align-items: baseline; }
.list button:hover { background: rgba(95,227,255,.05); }
.list .c { font-family: var(--mono); font-size: 11px; color: var(--glow); }
.list .t { font-family: var(--display); font-weight: 600; font-size: 16px; color: #eaf8fc; }
.list .s { display: block; font-family: var(--body); font-weight: 400; font-size: 13px; color: var(--dim); }
.list .a { color: var(--dim); font-family: var(--mono); }
.demo, .ecg { border: 1px solid var(--line); background: #000; margin: 0 0 14px; }
.demo { padding: 10px; }
.demo svg { width: 100%; height: auto; display: block; }
.demo .row { display: flex; align-items: center; gap: 10px; }
.demo label { font-family: var(--mono); font-size: 10.5px; color: var(--dim); letter-spacing: .1em; text-transform: uppercase; }
.demo input { flex: 1; min-width: 0; accent-color: var(--glow); }
.demo output { font-family: var(--mono); font-size: 12px; color: var(--glow); font-variant-numeric: tabular-nums; min-width: 84px; text-align: right; }
.ecg { width: 100%; height: 54px; display: block; }
.ecg path { fill: none; stroke: var(--glow); stroke-width: 1.6; stroke-dasharray: 900; animation: trace 2.4s linear infinite; filter: drop-shadow(0 0 3px var(--glow)); }
@keyframes trace { from { stroke-dashoffset: 900; } to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .ecg path { animation: none; stroke-dasharray: none; } }

@media (max-width: 760px) {
  nav.subs button { padding: 9px 11px; font-size: 11px; letter-spacing: .08em; }
  .panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 72%; border-width: 1px 0 0;
    padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  .hint { font-size: 10px; letter-spacing: .06em; }
}
</style>
</head>
<body>

<div class="room">
  <header class="top">
    <div class="brand">Chanwoo Kim<span>ME · BU 2027</span></div>
    <nav class="subs" aria-label="Sections">
      <button type="button" data-sec="about" aria-pressed="false">About</button>
      <button type="button" data-sec="projects" aria-pressed="false">Projects</button>
      <button type="button" data-sec="research" aria-pressed="false">Research</button>
      <button type="button" data-sec="contact" aria-pressed="false">Contact</button>
    </nav>
  </header>

  <main class="stage">
    <svg id="scene" viewBox="0 0 900 620" preserveAspectRatio="xMidYMid meet" role="group" aria-label="A lab with a glass capsule holding a human figure with a glowing nervous system, and Chanwoo in a lab coat reading a note">
      <defs>
        <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#06202c"/><stop offset=".75" stop-color="#041520"/><stop offset="1" stop-color="#03101a"/>
        </linearGradient>
        <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#062431"/><stop offset="1" stop-color="#020a10"/>
        </linearGradient>
        <radialGradient id="aura" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5fe3ff" stop-opacity=".28"/><stop offset=".6" stop-color="#5fe3ff" stop-opacity=".06"/><stop offset="1" stop-color="#5fe3ff" stop-opacity="0"/></radialGradient>
        <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bff6ff" stop-opacity=".16"/><stop offset="1" stop-color="#bff6ff" stop-opacity="0"/></linearGradient>
        <linearGradient id="glass" x1="0" x2="1">
          <stop offset="0" stop-color="#8ff0ff" stop-opacity=".16"/><stop offset=".1" stop-color="#8ff0ff" stop-opacity=".03"/>
          <stop offset=".8" stop-color="#8ff0ff" stop-opacity=".0"/><stop offset=".92" stop-color="#8ff0ff" stop-opacity=".1"/><stop offset="1" stop-color="#8ff0ff" stop-opacity=".18"/>
        </linearGradient>
        <clipPath id="tankClip"><rect x="132" y="96" width="276" height="456"/></clipPath>
        <linearGradient id="rod" x1="0" x2="1"><stop offset="0" stop-color="#03141c"/><stop offset=".35" stop-color="#2a7f95"/><stop offset=".5" stop-color="#bff6ff"/><stop offset=".7" stop-color="#1b5d70"/><stop offset="1" stop-color="#03141c"/></linearGradient>
        <linearGradient id="band" x1="0" x2="1"><stop offset="0" stop-color="#041a24"/><stop offset=".3" stop-color="#0d4253"/><stop offset=".55" stop-color="#1a6a80"/><stop offset=".8" stop-color="#0b3a4a"/><stop offset="1" stop-color="#041a24"/></linearGradient>
        <radialGradient id="bodyFill" cx=".5" cy=".42" r=".6"><stop offset="0" stop-color="#5fe3ff" stop-opacity=".2"/><stop offset=".7" stop-color="#5fe3ff" stop-opacity=".07"/><stop offset="1" stop-color="#5fe3ff" stop-opacity=".14"/></radialGradient>
        <linearGradient id="coatFill" x1="0" x2="1"><stop offset="0" stop-color="#0d4253"/><stop offset=".45" stop-color="#062a37"/><stop offset="1" stop-color="#031820"/></linearGradient>
        <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dffbff" stop-opacity="0"/><stop offset=".2" stop-color="#dffbff" stop-opacity=".22"/><stop offset=".8" stop-color="#dffbff" stop-opacity=".18"/><stop offset="1" stop-color="#dffbff" stop-opacity="0"/></linearGradient>
      </defs>

      <!-- ===== LAB ===== -->
      <rect x="-500" y="-100" width="1900" height="570" fill="url(#wall)"/>
      <rect x="-500" y="470" width="1900" height="300" fill="url(#floorG)"/>
      <g id="floorLines" stroke="#5fe3ff" stroke-opacity=".09"></g>
      <line x1="-500" y1="470" x2="1400" y2="470" stroke="#5fe3ff" stroke-opacity=".35"/>
      <!-- wall panels -->
      <g stroke="#5fe3ff" stroke-opacity=".07"><line x1="110" y1="40" x2="110" y2="470"/><line x1="440" y1="40" x2="440" y2="470"/><line x1="660" y1="40" x2="660" y2="470"/><line x1="0" y1="40" x2="900" y2="40"/><line x1="0" y1="250" x2="900" y2="250"/></g>
      <!-- ceiling lights -->
      <g class="lamp"><rect x="150" y="12" width="240" height="6" rx="3" fill="#dffbff"/><path d="M150 18 H390 L460 470 H80 Z" fill="url(#cone)"/></g>
      <g class="lamp"><rect x="600" y="12" width="220" height="6" rx="3" fill="#dffbff"/><path d="M600 18 H820 L880 470 H540 Z" fill="url(#cone)" opacity=".7"/></g>
      <!-- wall display: step response -->
      <g transform="translate(468,78)">
        <rect width="170" height="100" rx="3" fill="#031822" stroke="#5fe3ff" stroke-opacity=".55"/>
        <g stroke="#5fe3ff" stroke-opacity=".12"><line x1="12" y1="80" x2="160" y2="80"/><line x1="12" y1="56" x2="160" y2="56"/><line x1="12" y1="32" x2="160" y2="32"/><line x1="12" y1="14" x2="12" y2="80"/></g>
        <path d="M14 78 H46 C56 78 58 26 80 22 S120 20 158 20" fill="none" stroke="#8ff0ff" stroke-width="1.6"/>
        <path d="M14 78 H46 C66 78 76 46 100 36 S140 28 158 27" fill="none" stroke="#8ff0ff" stroke-opacity=".45" stroke-dasharray="3 3"/>
        <text x="12" y="10" font-family="JetBrains Mono, monospace" font-size="7" letter-spacing="1" fill="#6f9fb0">HFS STEP RESPONSE · τ</text>
        <text x="158" y="94" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="7" fill="#6f9fb0">t [s]</text>
      </g>
      <!-- shelves -->
      <g fill="none" stroke="#5fe3ff" stroke-opacity=".32" stroke-width="1">
        <line x1="450" y1="232" x2="640" y2="232"/><line x1="450" y1="300" x2="640" y2="300"/>
        <line x1="456" y1="300" x2="456" y2="306"/><line x1="634" y1="300" x2="634" y2="306"/>
        <path d="M462 232 V206 H476 V232 M468 206 V200"/>
        <path d="M486 232 L490 214 V204 H498 V214 L502 232 Z"/>
        <rect x="514" y="210" width="26" height="22" rx="2"/><line x1="514" y1="218" x2="540" y2="218"/>
        <path d="M552 232 V196 Q552 190 558 190 H566 Q572 190 572 196 V232"/>
        <path d="M584 232 l6 -14 v-10 h6 v10 l6 14 z"/><path d="M612 232 V214 H632 V232 M616 214 V208 H628 V214"/>
        <rect x="462" y="276" width="40" height="24" rx="2"/><rect x="510" y="282" width="18" height="18" rx="9"/>
        <path d="M542 300 V268 H556 V300 M546 268 V262"/><rect x="570" y="270" width="58" height="30" rx="2"/><line x1="576" y1="280" x2="622" y2="280"/>
      </g>
      <!-- lab bench -->
      <g fill="none" stroke="#5fe3ff" stroke-opacity=".38" stroke-width="1.1">
        <path d="M600 398 H900 M600 398 V404 H900"/>
        <line x1="612" y1="404" x2="612" y2="470"/><line x1="886" y1="404" x2="886" y2="470"/>
        <rect x="628" y="410" width="80" height="44"/><line x1="628" y1="432" x2="708" y2="432"/><line x1="664" y1="420" x2="672" y2="420"/><line x1="664" y1="442" x2="672" y2="442"/>
        <!-- monitor with ECG -->
        <rect x="806" y="318" width="84" height="56" rx="3" fill="#031822"/><path d="M842 374 V390 M828 398 L834 390 H850 L856 398"/>
        <path d="M812 350 H828 L832 342 L836 350 H842 L846 328 L851 362 L855 350 H884" stroke="#8ff0ff" stroke-opacity=".9"/>
        <!-- microscope -->
        <path d="M640 398 H676 M652 398 V388 M650 388 H664 M656 388 L672 352 M668 360 L684 352 L676 338 L664 344 Z M672 352 L680 368 H690"/>
        <!-- flasks -->
        <path d="M696 398 L706 374 V362 H714 V374 L724 398 Z"/><line x1="701" y1="388" x2="719" y2="388" stroke-opacity=".6"/>
        <path d="M734 398 V368 H744 V398"/><path d="M752 398 V356 H760 V398"/>
        <!-- robot arm -->
        <path d="M770 398 H800 M778 398 V390 H792 V398 M785 390 L776 360 L798 340 L806 346 M776 360 m-4 0 a4 4 0 1 0 8 0 a4 4 0 1 0 -8 0 M798 340 m-3 0 a3 3 0 1 0 6 0 a3 3 0 1 0 -6 0"/>
      </g>
      <!-- left wall rack -->
      <g fill="none" stroke="#5fe3ff" stroke-opacity=".25">
        <rect x="18" y="230" width="70" height="240"/><line x1="18" y1="290" x2="88" y2="290"/><line x1="18" y1="350" x2="88" y2="350"/><line x1="18" y1="410" x2="88" y2="410"/>
        <g stroke-opacity=".6"><line x1="28" y1="250" x2="40" y2="250"/><line x1="28" y1="310" x2="44" y2="310"/><line x1="28" y1="370" x2="36" y2="370"/></g>
        <g fill="#8ff0ff" stroke="none" opacity=".8"><circle cx="78" cy="250" r="2"/><circle cx="78" cy="310" r="2"/><circle cx="70" cy="310" r="2"/><circle cx="78" cy="370" r="2"/></g>
      </g>

      <!-- ===== CAPSULE (back) ===== -->
      <ellipse cx="270" cy="560" rx="230" ry="44" fill="url(#aura)"/>
      <ellipse cx="270" cy="320" rx="190" ry="250" fill="url(#aura)" opacity=".7"/>
      <g fill="none" stroke="#8ff0ff">
        <path d="M132 96 A138 20 0 0 1 408 96" stroke-opacity=".35"/>
        <path d="M132 552 A138 20 0 0 1 408 552" stroke-opacity=".3"/>
        <line x1="190" y1="80" x2="190" y2="536" stroke-opacity=".22" stroke-width="3"/>
        <line x1="350" y1="80" x2="350" y2="536" stroke-opacity=".22" stroke-width="3"/>
      </g>
      <rect x="132" y="96" width="276" height="456" fill="url(#glass)"/>
      <!-- platform disc inside -->
      <ellipse cx="270" cy="546" rx="110" ry="14" fill="#06303e" stroke="#8ff0ff" stroke-opacity=".6"/>
      <ellipse cx="270" cy="546" rx="80" ry="9" fill="none" stroke="#8ff0ff" stroke-opacity=".35"/>

      <!-- ===== HUMAN FIGURE ===== -->
      <g class="glow-soft">
        <path id="bodyOutline" fill="url(#bodyFill)" stroke="#b8f6ff" stroke-width="1.5" stroke-linejoin="round"/>
      </g>
      <g id="anatomy" fill="none" stroke="#b8f6ff" stroke-opacity=".35" stroke-width=".9" stroke-linecap="round"></g>
      <g id="nerves" fill="none" stroke="#8ff0ff" stroke-linecap="round" class="glow-soft"></g>
      <g id="pulses" fill="#e8fdff"></g>

      <!-- ===== CAPSULE (front) ===== -->
      <g clip-path="url(#tankClip)"><ellipse class="scanring" cx="270" cy="110" rx="138" ry="20" fill="none" stroke="#8ff0ff" stroke-opacity=".45"/></g>
      <ellipse cx="270" cy="112" rx="120" ry="15" fill="#5fe3ff" fill-opacity=".12" stroke="#bff6ff" stroke-opacity=".5"/>
      <ellipse cx="270" cy="112" rx="92" ry="10" fill="none" stroke="#bff6ff" stroke-opacity=".35"/>
      <g fill="none" stroke="#bff6ff" class="glow-soft">
        <path d="M132 96 A138 20 0 0 0 408 96" stroke-opacity=".85"/>
        <path d="M132 552 A138 20 0 0 0 408 552" stroke-opacity=".7"/>
      </g>
      <!-- glass reflections, curved -->
      <path d="M152 118 C146 220 146 420 154 532" fill="none" stroke="url(#hl)" stroke-width="7" stroke-linecap="round"/>
      <path d="M166 130 C161 240 161 410 168 512" fill="none" stroke="url(#hl)" stroke-width="2"/>
      <path d="M392 124 C398 240 398 420 390 528" fill="none" stroke="url(#hl)" stroke-width="3"/>
      <!-- cable bundle looping off the left post -->
      <g fill="none" stroke="#5fe3ff" stroke-opacity=".55" stroke-linecap="round">
        <path d="M116 186 C92 196 84 230 86 270 C88 330 80 390 90 450 C96 500 92 540 104 560 C116 576 140 584 170 590" stroke-width="2.4"/>
        <path d="M116 192 C98 204 92 236 94 270 C96 330 90 390 98 448 C104 498 100 536 110 556" stroke-width="1.4"/>
        <path d="M116 312 C100 320 96 340 98 360 C100 380 96 400 92 420" stroke-width="1.6"/>

<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const mk = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ===== floor perspective =====

  for (let i = -30; i <= 30; i++) mk('line', { x1: 450 + i * 18, y1: 470, x2: 450 + i * 90, y2: 620 }, fl);

  // ===== human outline (right half, mirrored) =====
  const CX = 270;
  const R = [[0,108],[13,110],[21,118],[24,131],[23,145],[19,157],[14,166],[10,172],[12,177],[17,184],[30,190],[46,195],[58,202],[66,214],[68,228],[67,244],[70,258],[68,272],[70,288],[75,302],[78,318],[79,334],[80,346],[85,356],[89,370],[86,384],[80,390],[73,386],[69,374],[67,360],[64,348],[60,330],[57,312],[55,298],[54,286],[56,270],[55,252],[50,236],[47,246],[46,262],[42,280],[38,296],[37,308],[40,320],[43,334],[47,350],[49,368],[47,388],[43,410],[38,428],[36,440],[38,452],[41,466],[40,482],[34,500],[28,514],[27,522],[30,532],[34,542],[30,548],[16,548],[10,544],[10,536],[11,522],[16,500],[19,478],[17,458],[14,442],[13,430],[14,410],[11,390],[7,370],[4,360],[0,357]];
  // stretch: upper body compressed slightly, legs lengthened
  const Y = y => y <= 357 ? 100 + (y - 108) * .9 : 324 + (y - 357) * 1.173;
  const RM = d => d.replace(/(-?\d+(?:\.\d+)?) (-?\d+(?:\.\d+)?)/g, (m, x, y) => x + ' ' + Y(+y).toFixed(1));
  const mapR = r => r.map(([x, y]) => [x, Y(y)]);
  const pts = R.map(([dx, y]) => [CX + dx, +Y(y).toFixed(1)]).concat(R.slice(1, -1).reverse().map(([dx, y]) => [CX - dx, +Y(y).toFixed(1)]));
  function smoothClosed(p) {
    const n = p.length; let d = `M${p[0][0]} ${p[0][1]}`;
    for (let i = 0; i < n; i++) {
      const p0 = p[(i - 1 + n) % n], p1 = p[i], p2 = p[(i + 1) % n], p3 = p[(i + 2) % n];
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0]} ${p2[1]}`;
    }
    return d + ' Z';
  }
  $('bodyOutline').setAttribute('d', smoothClosed(pts));

  // anatomy detail lines (mirrored)
  const an = $('anatomy');
  const both = d0 => { const d = RM(d0); mk('path', { d }, an); mk('path', { d, transform: `translate(${2 * CX},0) scale(-1,1)` }, an); };
  both('M262 192 Q246 196 228 200');                      // clavicle
  both('M266 212 Q246 240 222 228'); both('M268 236 Q250 246 230 238'); // pectoral

  // ===== nervous system =====

  path(RM('M262 140 Q270 148 278 140'), .9, .7);
  // spine with vertebra ticks

  for (let y0 = 188; y0 <= 350; y0 += 8) { const y = Y(y0); mk('line', { x1: CX - 3, y1: y, x2: CX + 3, y2: y, 'stroke-width': .8, 'stroke-opacity': .55 }, nerves); }
  // intercostal nerves
  for (let y0 = 212; y0 <= 300; y0 += 14) { const y = Y(y0);
    const w = y0 < 300 ? 34 : 30;
    path(`M270 ${y} Q${270 + w * .6} ${y - 2} ${270 + w} ${y + 10}`, .7, .45);
    path(`M270 ${y} Q${270 - w * .6} ${y - 2} ${270 - w} ${y + 10}`, .7, .45);
  }
  // limb routes (right side, mirrored for left)
  const armR = mapR([[270,198],[300,200],[322,214],[332,240],[338,286],[346,318],[350,346],[352,370]]);
  const legR = mapR([[270,352],[284,360],[292,390],[296,440],[294,480],[291,515],[293,540]]);
  const mirror = r => r.map(([x, y]) => [2 * CX - x, y]);
  const routes = [mapR([[270,140],[270,356]]), armR, mirror(armR), legR, mirror(legR)];
  const pl = r => 'M' + r.map(p => p.join(' ')).join(' L');
  function twigs(route, side0) {
    let side = side0;
    for (let i = 1; i < route.length - 1; i++) {
      const [x0, y0] = route[i - 1], [x1, y1] = route[i];
      for (let t = .3; t < 1; t += .35) {
        const x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * t, dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
        const nx = -dy / L * side, ny = dx / L * side, len = 7 + Math.random() * 6;
        path(`M${x.toFixed(1)} ${y.toFixed(1)} q${(nx * len * .6 + dx / L * len * .5).toFixed(1)} ${(ny * len * .6 + dy / L * len * .5).toFixed(1)} ${(nx * len + dx / L * len * .7).toFixed(1)} ${(ny * len + dy / L * len * .7).toFixed(1)}`, .6, .4);
        side = -side;

  [armR, mirror(armR), legR, mirror(legR)].forEach((r, i) => { path(pl(r), 1.2, .85); twigs(r, i % 2 ? -1 : 1); });
  // finger nerves
  [[352,Y(372)],[188,Y(372)]].forEach(([x, y]) => { const s = x > CX ? 1 : -1; [-6,-2,2,6].forEach(o => path(`M${x} ${y} l${s * (o * .2 + 1)} ${12 + Math.abs(o) * -.3} l${s * o * .4} 4`, .6, .5)); });
  // intercostal routes for pulses
  for (let y0 = 212; y0 <= 300; y0 += 28) { const y = Y(y0); routes.push([[270,y],[300,y + 4]]); routes.push([[270,y],[240,y + 4]]); }

  // organic branching (seeded so it is stable)
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  function grow(x, y, ang, len, depth, w, o) {
    const ex = x + Math.cos(ang) * len, ey = y + Math.sin(ang) * len, bend = (rnd() - .5) * len * .6;
    const cx = (x + ex) / 2 - Math.sin(ang) * bend, cy = (y + ey) / 2 + Math.cos(ang) * bend;
    mk('path', { d: `M${x.toFixed(1)} ${y.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}`, 'stroke-width': w, 'stroke-opacity': o }, nerves);
    if (depth > 0) { const k = 2; for (let i = 0; i < k; i++) grow(ex, ey, ang + (i ? 1 : -1) * (.25 + rnd() * .35), len * (.55 + rnd() * .2), depth - 1, w * .75, o * .85); }
  }
  [armR, mirror(armR), legR, mirror(legR)].forEach((r, ri) => {
    for (let i = 1; i < r.length; i++) {
      const [x0, y0] = r[i - 1], [x1, y1] = r[i], a = Math.atan2(y1 - y0, x1 - x0);
      for (let t = .2; t < 1; t += .4) { const x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * t, sgn = (Math.floor(t * 10) % 2 ? 1 : -1); grow(x, y, a + sgn * .45, 9 + rnd() * 5, 2, .7, .5); }
    }
  });
  // plexus fans: brachial, lumbar, sacral
  [[300,Y(204),0.2],[240,Y(204),Math.PI-0.2]].forEach(([x,y,a]) => { for (let i = -2; i <= 2; i++) grow(x, y, a + i * .25, 14, 2, .7, .55); });
  for (let i = -3; i <= 3; i++) { grow(270, Y(346), Math.PI / 2 + i * .32, 16, 2, .7, .55); }
  for (let y0 = 200; y0 <= 320; y0 += 9) { const y = Y(y0); grow(270, y, -.25 + (y % 2) * .1, 20 + (y0 - 200) * .05, 1, .55, .4); grow(270, y, Math.PI + .25, 20 + (y0 - 200) * .05, 1, .55, .4); }

  // bolts on the top band and seams on the base
  const bolts = $('bolts'), seams = $('seams');
  for (let d = 15; d <= 165; d += 15) { const a = d * Math.PI / 180; mk('circle', { cx: (270 + Math.cos(a) * 150).toFixed(1), cy: (80 + Math.sin(a) * 26).toFixed(1), r: 1.6 }, bolts); }
  for (let d = 20; d <= 160; d += 20) { const a = d * Math.PI / 180, x = 270 + Math.cos(a) * 170, y = 572 + Math.sin(a) * 30; mk('line', { x1: x.toFixed(1), y1: y.toFixed(1), x2: x.toFixed(1), y2: (y + 18).toFixed(1) }, seams); }

  // ===== nodes (electrodes) =====
  const N = {
    brain: { code: 'N-01', name: 'Mission', sub: 'Why medical robotics', xy: [270,124], side: 'r', post: 404, py: 150 },
    heart: { code: 'N-02', name: 'Heart Rate Monitor', sub: 'Wearable for elderly users', xy: [283,236], side: 'r', post: 404, py: 196 },
    core:  { code: 'N-04', name: 'Thermal Core', sub: 'Capstone heat recovery', xy: [270,300], side: 'r', post: 404, py: 310 },

    knee:  { code: 'N-07', name: 'Lower Limb', sub: 'Fracture model and soft leg', xy: [296,440], side: 'r', post: 404, py: 436 },
    eye:   { code: 'N-06', name: 'Mechatronics', sub: 'Autonomous puck launcher', xy: [190,370], side: 'l', post: 136, py: 322 },

  const cables = $('cables'), nodesG = $('nodes');
  Object.entries(N).forEach(([k, n]) => {
    const x = n.xy[0], y = Y(n.xy[1]), px = n.post, sag = 12; n.py = y - 24;
    mk('path', { d: `M${px} ${n.py} C${px + (x - px) * .3} ${n.py + sag} ${x + (px - x) * .3} ${y + sag} ${x} ${y}` }, cables);

    mk('circle', { class: 'dot', cx: x, cy: y, r: 2.6 }, g);

  });

  // ===== pulses along nerve routes =====
  if (!reduce) {
    const lens = routes.map(r => { const segs = []; let tot = 0; for (let i = 1; i < r.length; i++) { const l = Math.hypot(r[i][0] - r[i-1][0], r[i][1] - r[i-1][1]); segs.push(l); tot += l; } return { segs, tot }; });
    const at = (ri, d) => { const r = routes[ri], L = lens[ri]; for (let i = 0; i < L.segs.length; i++) { if (d <= L.segs[i]) { const t = d / L.segs[i]; return [r[i][0] + (r[i+1][0] - r[i][0]) * t, r[i][1] + (r[i+1][1] - r[i][1]) * t]; } d -= L.segs[i]; } return r[r.length - 1]; };
    const pg = $('pulses');
    const ps = Array.from({ length: 22 }, () => ({ el: mk('circle', { r: 1.9 }, pg) }));
    const reset = p => { p.ri = Math.floor(Math.random() * routes.length); p.rev = Math.random() < .35; p.d = 0; p.v = .8 + Math.random() * 1.6; };
    ps.forEach(p => { reset(p); p.d = Math.random() * lens[p.ri].tot; });
    (function loop() {
      ps.forEach(p => {
        p.d += p.v; const tot = lens[p.ri].tot; if (p.d >= tot) reset(p);
        const d = p.rev ? lens[p.ri].tot - p.d : p.d, q = at(p.ri, Math.max(0, d)), f = p.d / lens[p.ri].tot;
        p.el.setAttribute('cx', q[0].toFixed(1)); p.el.setAttribute('cy', q[1].toFixed(1)); p.el.setAttribute('opacity', Math.sin(Math.min(1, f) * Math.PI).toFixed(2));
      });
      requestAnimationFrame(loop);
    })();
  }

    hand: { label: 'N-05 · Frumkin Lab', html: `

  const listOf = keys => '<ul class="list">' + keys.map(k => `<li><button type="button" data-go="${k}"><span class="c">${N[k].code}</span><span class="t">${N[k].name}<span class="s">${N[k].sub}</span></span><span class="a">→</span></button></li>`).join('') + '</ul>';
  const S = {

  const panel = $('panel'), meBtn = $('meBtn');
  function render(c, activeKey, sec) {
    $('pLabel').textContent = c.label; $('pBody').innerHTML = c.html; panel.hidden = false; panel.scrollTop = 0;
    document.querySelectorAll('.node').forEach(n => n.classList.toggle('active', n.dataset.key === activeKey));
    meBtn.classList.toggle('active', activeKey === 'me');
    document.querySelectorAll('nav.subs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.sec === sec ? 'true' : 'false'));
    panel.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => show(b.dataset.go)));
    const fp = $('fp');
    if (fp) {
      const f = () => { const p = fp.value / 100; $('fj1').setAttribute('transform', 'translate(78,0) rotate(' + (62*p).toFixed(1) + ')'); $('fj2').setAttribute('transform', 'translate(74,0) rotate(' + (78*p).toFixed(1) + ')'); document.querySelectorAll('.fs').forEach(s => s.setAttribute('fill', 'rgba(95,227,255,' + (.08 + .5*p).toFixed(2) + ')')); $('fo').textContent = Math.round(62*p) + '° / ' + Math.round(78*p) + '°'; };

  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !panel.hidden) close(); });
})();
